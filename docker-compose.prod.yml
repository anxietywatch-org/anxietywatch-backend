services:
  api:
    image: ghcr.io/anxietywatch-org/anxietywatch-backend:develop
    container_name: anxietywatch-api-prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Cors__AllowedOrigins: http://localhost:5222,https://mangoon.xyz,https://anxietywatch-web-g5mjb.ondigitalocean.app
      Persistence__Provider: Mongo
      Mongo__ConnectionString: ${MONGO_ATLAS_CONNECTION_STRING}
      Mongo__DatabaseName: anxietywatch
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Email__Provider: ${EMAIL_PROVIDER:-Resend}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      Email__From: ${EMAIL_FROM:-AnxietyWatch <no-reply@mail.mangoon.xyz>}
      Email__VerificationUrl: ${EMAIL_VERIFICATION_URL:-https://mangoon.xyz/verify-email}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - anxietywatch_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  reverse-proxy:
    image: caddy:2.10.2-alpine
    container_name: anxietywatch-caddy-prod
    command:
      - caddy
      - reverse-proxy
      - --from
      - api.mangoon.xyz
      - --to
      - api:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - anxietywatch_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  anxietywatch_network:
    driver: bridge
    external: false

volumes:
  caddy_data:
  caddy_config:
