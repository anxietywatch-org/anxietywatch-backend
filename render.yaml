services:
  - type: web
    name: anxietywatch-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: Persistence__Provider
        value: Mongo
      - key: Mongo__DatabaseName
        value: anxietywatch
      - key: Mongo__ConnectionString
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
