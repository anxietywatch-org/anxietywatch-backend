name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore AnxietyWatchAPI.slnx
      - name: Build
        run: dotnet build AnxietyWatchAPI.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test AnxietyWatchAPI.slnx --configuration Release --no-build --verbosity normal
      - name: Check for vulnerable packages
        run: dotnet list AnxietyWatchAPI.slnx package --vulnerable --include-transitive
      - name: Validate production Compose configuration
        env:
          MONGO_ATLAS_CONNECTION_STRING: mongodb://compose-validation.invalid/anxietywatch
          JWT_SIGNING_KEY: compose-validation-key-not-used-at-runtime
        run: docker compose -f docker-compose.prod.yml config --quiet

  build-docker-image:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-image-do:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && vars.PUSH_DOCR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DO_REGISTRY: registry.digitalocean.com/anxietywatch
      DO_IMAGE_NAME: anxietywatch-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DO_REGISTRY }}
          username: ${{ secrets.DO_PAT }}
          password: ${{ secrets.DO_PAT }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DO_REGISTRY }}/${{ env.DO_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image to DigitalOcean
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-droplet:
    needs: build-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load restricted deployment key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}
      - name: Trust the Droplet host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '161.35.110.44 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBm2W3vdm3/4lDjlpSlp4Rx9X7ost9gTQDqDaIKl+CIg' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image built by this workflow
        run: docker pull "${REGISTRY}/${IMAGE_NAME}:develop"
      - name: Upload the validated production Compose file
        run: ssh root@161.35.110.44 upload-compose < docker-compose.prod.yml
      - name: Stream the image to the Droplet
        run: docker save "${REGISTRY}/${IMAGE_NAME}:develop" | ssh root@161.35.110.44 load-image
      - name: Run the restricted deployment command
        run: ssh root@161.35.110.44 deploy
      - name: Verify the public HTTPS deployment
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://api.mangoon.xyz/health >/dev/null \
              && curl --fail --silent --show-error --max-time 15 https://api.mangoon.xyz/api/plans >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "The public API did not become healthy after deployment." >&2
          exit 1
